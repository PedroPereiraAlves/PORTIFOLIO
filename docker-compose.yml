services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedrohung
      POSTGRES_USER: pedrohung
      POSTGRES_PASSWORD: pedrohung
    ports:
      - "5432:5432"
    volumes:
      - pedrohung_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedrohung -d pedrohung"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=pedrohung;Username=pedrohung;Password=pedrohung
      HUB_OWNER_EMAIL: ${HUB_OWNER_EMAIL:-owner@local.test}
      HUB_OWNER_PASSWORD: ${HUB_OWNER_PASSWORD:-Owner123!}
      HUB_GITHUB_TOKEN: ${HUB_GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pedrohung_pg:
